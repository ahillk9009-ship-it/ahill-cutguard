name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m unittest discover -s tests -p test_review_compare.py -v
      - run: python -m unittest discover -s tests -p test_validation.py -v
      - run: python -m unittest discover -s tests -p test_gui_startup.py -v
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
