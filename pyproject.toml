[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ahill-cutguard"
version = "0.2.2"
description = "Local-first video and subtitle QC with reviewable evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ahill CutGuard contributors"}]
keywords = ["video", "quality-control", "subtitles", "ffmpeg"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video"]

[project.scripts]
cutguard = "cutguard.cli:main"

[tool.setuptools]
packages = ["cutguard"]
